name: Deploying on EC2

on: 
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploying on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          key: ${{ secrets.EC2_SSH_KEY }}
          username: ubuntu
          script: |
            git pull origin main 
            cd /home/ubuntu/mern-fullstack-development/NODEJS/server/server_mvc
            npm i 
            npm run start
